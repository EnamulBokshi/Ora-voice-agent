services:
  # ==========================================
  # 1. MongoDB Database (v7.0)
  # ==========================================
  ora-mongodb:
    image: mongo:7.0
    container_name: ora-mongodb
    restart: unless-stopped
    ports:
      - "${ORA_MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-ora_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-ora_password_dev}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-ora_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - ora-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 }).ok' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Redis Cache & Session Store (v7 Alpine)
  # ==========================================
  ora-redis:
    image: redis:7-alpine
    container_name: ora-redis
    restart: unless-stopped
    ports:
      - "${ORA_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ora-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # 3. ORA Backend API & Voice Proxy (NestJS)
  # ==========================================
  ora-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ora-server
    restart: unless-stopped
    ports:
      - "${ORA_SERVER_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-ora_admin}:${MONGO_INITDB_ROOT_PASSWORD:-ora_password_dev}@ora-mongodb:27017/${MONGO_INITDB_DATABASE:-ora_db}?authSource=admin
      REDIS_HOST: ora-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_ora_change_me_in_prod}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-ora-aes-256-secret-key-32bytes!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-models/gemini-3.1-flash-live-preview}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-models/gemini-3.1-flash-live-preview}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}
      RAG_PRODUCT_CONFIDENCE_THRESHOLD: ${RAG_PRODUCT_CONFIDENCE_THRESHOLD:-0.65}
      RAG_KNOWLEDGE_CONFIDENCE_THRESHOLD: ${RAG_KNOWLEDGE_CONFIDENCE_THRESHOLD:-0.60}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-5}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-ORA <onboarding@noreply.magicfunnel.io>}
    depends_on:
      ora-mongodb:
        condition: service_healthy
      ora-redis:
        condition: service_healthy
    networks:
      - ora-network

  # ==========================================
  # 4. ORA Frontend Dashboard (Next.js 16+)
  # ==========================================
  ora-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:5000}
    container_name: ora-client
    restart: unless-stopped
    ports:
      - "${ORA_CLIENT_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NESTJS_BACKEND_URL: http://ora-server:5000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:5000}
    depends_on:
      ora-server:
        condition: service_healthy
    networks:
      - ora-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  ora-network:
    driver: bridge
