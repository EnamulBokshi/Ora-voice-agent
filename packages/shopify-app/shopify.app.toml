# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "737871ce3c359802b6363609149bc67b"
name = "ORA-VOICE-AI"
application_url = "https://tryora.live/shopify"
embedded = true
handle = "ora-voice-ai"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "https://tryora.live/api/v1/shopify/webhooks/compliance/customers-data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "https://tryora.live/api/v1/shopify/webhooks/compliance/customers-redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://tryora.live/api/v1/shopify/webhooks/compliance/shop-redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://tryora.live/api/v1/ingestion/webhooks/shopify"
  topics = [
  "products/create",
  "products/update",
  "inventory_levels/update",
  "app/uninstalled",
  "products/delete"
]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_orders,read_products,write_products"

[auth]
redirect_urls = [ "https://tryora.live/api/v1/shopify/callback" ]
