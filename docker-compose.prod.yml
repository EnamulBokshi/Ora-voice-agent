services:
  # ==========================================
  # 1. MongoDB Database (v7.0)
  # ==========================================
  ora-mongodb:
    image: mongo:7.0
    container_name: ora-mongodb
    restart: always
    ports:
      # Strictly bound to localhost to prevent public internet access
      - "127.0.0.1:${ORA_MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-ora_prod_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MongoDB password required in production}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-ora_production}
    volumes:
      - ora_mongo_data:/data/db
    networks:
      - ora-production-network
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 }).ok' --quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ==========================================
  # 2. Redis Cache & Session Store (v7 Alpine)
  # ==========================================
  ora-redis:
    image: redis:7-alpine
    container_name: ora-redis
    restart: always
    ports:
      # Strictly bound to localhost to prevent public internet access
      - "127.0.0.1:${ORA_REDIS_PORT:-6380}:6379"
    volumes:
      - ora_redis_data:/data
    networks:
      - ora-production-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ==========================================
  # 3. ORA Backend API & Voice Proxy (NestJS)
  # ==========================================
  ora-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ora-server
    restart: always
    ports:
      - "127.0.0.1:${ORA_SERVER_PORT:-4000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-https://tryora.live}

      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-ora_prod_admin}:${MONGO_INITDB_ROOT_PASSWORD}@ora-mongodb:27017/${MONGO_INITDB_DATABASE:-ora_production}?authSource=admin
      REDIS_HOST: ora-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?ENCRYPTION_SECRET required in production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY required}
      GEMINI_MODEL: ${GEMINI_MODEL:-models/gemini-2.5-flash-native-audio-latest}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-models/gemini-2.5-flash-native-audio-latest}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-models/text-embedding-004}
      RAG_PRODUCT_CONFIDENCE_THRESHOLD: ${RAG_PRODUCT_CONFIDENCE_THRESHOLD:-0.65}
      RAG_KNOWLEDGE_CONFIDENCE_THRESHOLD: ${RAG_KNOWLEDGE_CONFIDENCE_THRESHOLD:-0.60}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-5}
      # Shopify embedded app. SHOPIFY_API_KEY is the Partner app Client ID and
      # the expected `aud` of every App Bridge session token, so session
      # verification fails outright without it.
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-read_products,write_products,read_inventory,read_orders}
      # ORA_API_URL is this API's public origin: it builds the webhook endpoint,
      # the OAuth callback, and the billing return URL. SHOPIFY_APP_URL is the
      # embedded frontend's public URL, which nginx serves at /shopify on the
      # same origin. They are different values and are not interchangeable.
      ORA_API_URL: ${ORA_API_URL:-https://tryora.live}
      SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:-https://tryora.live/shopify}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-ORA <onboarding@noreply.magicfunnel.io>}
      ADMIN_NAME: ${ADMIN_NAME:-Platform SuperAdmin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ora.admin@tryora.live}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      ora-mongodb:
        condition: service_healthy
      ora-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/v1/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ora-production-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================
  # 4. ORA Frontend Dashboard (Next.js 16+)
  # ==========================================
  ora-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://tryora.live}
    container_name: ora-client
    restart: always
    ports:
      - "127.0.0.1:${ORA_CLIENT_PORT:-4080}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NESTJS_BACKEND_URL: http://ora-server:5000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://tryora.live}
    depends_on:
      ora-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ora-production-network
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"

volumes:
  ora_mongo_data:
    driver: local
  ora_redis_data:
    driver: local

networks:
  ora-production-network:
    driver: bridge
