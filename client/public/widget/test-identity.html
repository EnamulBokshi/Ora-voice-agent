<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORA Identity & Stitching Test Playground</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0f12;
      color: #f3f4f6;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #181b20;
      border: 1px solid #2a2e37;
      border-radius: 12px;
      padding: 24px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; color: #c8f031; margin-top: 0; }
    h2 { font-size: 16px; margin-top: 0; color: #e5e7eb; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.5; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    button {
      background: #252a33;
      color: #fff;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: #323846; border-color: #c8f031; }
    button.primary { background: #c8f031; color: #111; font-weight: 600; border: none; }
    button.primary:hover { background: #b5db2b; }
    .log-box {
      background: #0f1115;
      border: 1px solid #232730;
      border-radius: 8px;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #a3e635;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-top: 15px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(200, 240, 49, 0.15);
      color: #c8f031;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🧪 ORA Identity & Stitching Playground</h1>
    <p>Use this interactive playground to test anonymous device tracking, fail-closed consent gates, and live identity stitching.</p>
    
    <div>
      <strong>Current State:</strong> <span id="status-badge" class="badge">Initializing...</span>
    </div>

    <div class="btn-group">
      <button onclick="testConsent(true)">✅ Grant Consent</button>
      <button onclick="testConsent(false)">❌ Deny Consent</button>
      <button onclick="checkDeviceId()">🔍 Inspect Device ID</button>
      <button class="primary" onclick="simulateLogin()">🔐 Simulate Login (Live Stitch)</button>
      <button onclick="clearState()">🗑️ Clear Storage</button>
    </div>

    <div id="log" class="log-box">Ready. Open browser DevTools Console for additional network details.\n</div>
  </div>

  <script>
    // Configuration for ORA Widget
    window.ORA_CONFIG = {
      key: 'biz_live_mock_key_12345',
      api: 'http://localhost:5000',
      consent: true, // Set to true for initial testing
      position: 'bottom-center'
    };

    function log(msg) {
      const box = document.getElementById('log');
      box.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      box.scrollTop = box.scrollHeight;
    }

    function checkDeviceId() {
      const devId = localStorage.getItem('ora_device_id');
      log(`📱 LocalStorage Device ID: ${devId || '(None - Ephemeral Mode)'}`);
      document.getElementById('status-badge').textContent = devId ? 'Persistent Device' : 'Ephemeral';
    }

    function testConsent(allowed) {
      window.ORA_CONFIG.consent = allowed;
      if (!allowed) {
        localStorage.removeItem('ora_device_id');
        log('🚫 Consent Denied. Ephemeral memory mode activated.');
        document.getElementById('status-badge').textContent = 'Consent Denied (Ephemeral)';
      } else {
        log('✅ Consent Granted. Device ID will persist.');
        document.getElementById('status-badge').textContent = 'Consent Granted';
      }
    }

    function simulateLogin() {
      const mockCustomerId = 'cust_shopify_' + Math.floor(10000 + Math.random() * 90000);
      log(`🔑 Simulating login for user: ${mockCustomerId}...`);

      if (window.ORA && typeof window.ORA.identify === 'function') {
        window.ORA.identify({
          id: mockCustomerId,
          email: 'alice.' + mockCustomerId + '@example.com',
          name: 'Alice Smith'
        });
        log(`⚡ window.ORA.identify() dispatched! Watch network tab for live WebSocket merge.`);
        document.getElementById('status-badge').textContent = 'Logged In: ' + mockCustomerId;
      } else {
        log('⚠️ window.ORA is still loading...');
      }
    }

    function clearState() {
      localStorage.clear();
      sessionStorage.clear();
      log('🧹 LocalStorage and SessionStorage cleared.');
      checkDeviceId();
    }

    setTimeout(checkDeviceId, 500);
  </script>

  <!-- Load the ORA Storefront Widget -->
  <script src="/widget/ora-widget.js" data-ora-key="biz_live_mock_key_12345" data-ora-api="http://localhost:5000"></script>
</body>
</html>
