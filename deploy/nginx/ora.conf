# ==============================================================================
# ORA Nginx Reverse Proxy Configuration with WebSocket & SSL Support
# Domain: tryora.live
# Frontend:     127.0.0.1:4080  (ora-client)
# Backend:      127.0.0.1:4000  (ora-server)
# Shopify app:  127.0.0.1:4080  (ora-client, embedded routes under /shopify)
#
# Everything is one origin on purpose. The dashboard and the Shopify embedded
# app both call the API at /api/v1 as a relative path, so those requests are
# same-origin and no CORS is involved. Only the storefront widget, loaded from
# arbitrary merchant domains, talks to this API cross-origin.
# ==============================================================================

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tryora.live www.tryora.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tryora.live www.tryora.live;

    # SSL Certificates (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tryora.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryora.live/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Security Headers
    #
    # These are server-level, so nginx applies them to every location that does
    # NOT declare an add_header of its own. A location with any add_header
    # inherits none of these and must restate what it needs — see
    # `location /shopify` below, which deliberately drops X-Frame-Options
    # because Shopify Admin has to be able to frame that app.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Maximum file upload size for catalog CSV/JSON/PDF ingestion
    client_max_body_size 50M;

    # 1. Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # 2. WebSocket Voice Proxy & Real-time Live Desk (/ws*, /socket.io*)
    location ~* ^/(ws|socket\.io) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts for persistent voice streaming
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 3. Shopify Embedded App (/shopify) -> ora-client:4080
    #
    # Served by the unified Next.js client in embedded mode.
    # Its own add_header directives replace every server-level one for this location,
    # safely allowing Shopify Admin to frame the application.
    location ^~ /shopify {
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Framable by Shopify Admin and by the merchant's own store domain
        add_header Content-Security-Policy "frame-ancestors https://admin.shopify.com https://*.myshopify.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # 4. Backend API Routes (/api/v1/)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming AI responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 5. Frontend Next.js Dashboard & Public Pages
    location / {
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
